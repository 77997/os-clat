#!/usr/sbin/nft -f
# Lab ISP "clat-world": forwarding policy, masquerade for the NAT64 pool, provisioning NAT.
# Loaded by Debian's nftables.service. A reload empties the set provision4 (provisioning NAT off), the
# chain echodf (echo replies of the test target as Linux sends them) and the chain resolver (DNS answered).
flush ruleset

table inet isp {
    # empty = provisioning NAT off. "ispctl provision on" adds 10.99.0.0/24.
    set provision4 {
        type ipv4_addr
        flags interval
    }

    chain input {
        type filter hook input priority filter; policy accept;
        # a LAN packet that OPNsense sent out of its management NIC is never answered (PLAN section 1)
        iifname "mgmt0" ip saddr != 10.99.0.0/24 counter drop
        iifname "ppp*" meta l4proto { tcp, udp } th dport 53 jump resolver
    }

    # empty = the DNS64 resolver answers the subscriber. "ispctl resolver off" adds the one rule that drops
    # its queries without an answer.
    chain resolver {
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
        # the IPv4 test target 192.88.99.1 exists on this VM only
        ip daddr 192.88.99.0/24 drop
        ct state established,related accept
        iifname "ppp*" oifname "nat64" accept
        iifname "nat64" oifname "ppp*" accept
        iifname "nat64" oifname "up0" accept
        iifname "ppp*" oifname "up0" ip saddr 100.64.0.0/24 accept
        iifname "mgmt0" oifname "up0" ip saddr @provision4 accept
        # other IPv6 from the subscriber gets an error, not silence: the lab has no IPv6 Internet
        iifname "ppp*" meta nfproto ipv6 counter reject with icmpv6 type no-route
    }

    chain output {
        type filter hook output priority filter; policy accept;
        oifname "up0" ip daddr 192.88.99.0/24 drop
    }

    # empty = the test target answers echo as Linux does, with DF clear, and the NAT64 (tayga 0.9.2) returns
    # every such reply above 1260 bytes as IPv6 fragments. "ispctl echodf on" adds the one rule that sets DF
    # on these replies, so that they come back whole.
    chain echodf {
        type filter hook output priority mangle; policy accept;
    }

    chain postrouting {
        type nat hook postrouting priority srcnat; policy accept;
        oifname "up0" ip saddr { 192.168.255.0/24, 100.64.0.0/24 } masquerade
        oifname "up0" ip saddr @provision4 masquerade
    }
}
