# Lab ISP resolver: the RDNSS address announced in the RA (profile P0), the two addresses of Google's public
# DNS64 that the customer page names (ispctl puts them on isp0), and 10.99.0.1 for provisioning.
# module-config and the ipv4only.arpa zone are in isp-dns64.conf, written by "ispctl dns64 on|off".
# Fallback if recursion through the Default Switch does not work (PLAN section 7 row 12):
#   forward-zone:  name: "."  forward-addr: <DNS server up0 got by DHCP>
#   and module-config without "validator" in ispctl (write_dns64).
server:
    interface: 2001:db8:64::53
    interface: 2001:4860:4860::6464
    interface: 2001:4860:4860::64
    interface: 10.99.0.1
    ip-freebind: yes
    access-control: 0.0.0.0/0 allow
    access-control: ::/0 allow
    prefer-ip4: yes
    # the system's send buffer: unbound's default (4m) needs CAP_NET_ADMIN, which Debian's AppArmor profile
    # denies at every start, and M5 checks that the kernel log has no AppArmor denial
    so-sndbuf: 0
    dns64-prefix: 64:ff9b::/96
