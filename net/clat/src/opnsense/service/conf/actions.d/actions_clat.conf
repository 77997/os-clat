[start]
command:/usr/local/etc/rc.d/clat start
parameters:
type:script
message:starting clat

[stop]
command:/usr/local/etc/rc.d/clat stop; exit 0
parameters:
type:script
message:stopping clat

[restart]
command:/usr/local/etc/rc.d/clat restart
parameters:
type:script
message:restarting clat
description:Restart CLAT

[reload]
command:/usr/local/etc/rc.d/clat reload
parameters:
type:script
message:reloading clat

[status]
command:/usr/local/etc/rc.d/clat status; exit 0
parameters:
type:script_output
message:request clat status

[details]
command:/usr/local/opnsense/scripts/clat/clatctl.py status
parameters:
type:script_output
message:request clat details

[event]
command:/usr/local/opnsense/scripts/clat/clatctl.py event
parameters:%s %s
type:script
message:clat event %s %s

[test]
command:/usr/local/opnsense/scripts/clat/clatctl.py test
parameters:
type:script_output
message:running clat tests
